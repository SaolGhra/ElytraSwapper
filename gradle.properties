# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true

# Mod properties
mod.version=2.0.0
mod.group=com.saolghra
mod.id=elytraswapper
mod.name=ElytraSwapper

# Per-version metadata. Real values live in versions/<mc>/gradle.properties, which is generated
# from maven metadata rather than hand-maintained — see scratchpad/gen_versions.py and
# .claude/docs/loader-support-matrix.md. These placeholders exist so a missing override fails loudly
# instead of silently building against the wrong dependency.
mod.mc_title=[VERSIONED]
mod.mc_targets=[VERSIONED]
mod.mc_dep_fabric=[VERSIONED]
mod.mc_dep_forgelike=[VERSIONED]
mod.java=[VERSIONED]
mod.unobfuscated=[VERSIONED]

deps.fabric_api=[VERSIONED]
deps.neoforge=[VERSIONED]
deps.forge=[VERSIONED]

# Shared across every version.
deps.fabric_loader=0.19.3
deps.mixin_extras=0.4.1
